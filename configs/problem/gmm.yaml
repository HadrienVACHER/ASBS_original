# @package _global_

# Override `dim` to run other dimensions, e.g., `dim=3,8,16,39,80,165 -m`
dim: 3
K: 5 # number of modes
target_seed: 0 # seed of the target (means & weights), independent of `seed`
# means: spread = all at distance `radius` from the origin, pushed apart (regular simplex for K <= dim+1:
#          every pair of modes at the same distance, ≈ radius*√2);
#        sphere = same radius, random directions; cube = Uniform([-a, a]^dim), a = 8*sqrt(3/(2*dim))
layout: spread
# radius: distance of the modes from the origin (sphere / spread only; null = √32 ≈ 5.66).
# 4.25 = just below where AS collapses for d = K in 16..48: every mode found, weights wrong (d <= 8 needs √32)
radius: 4.25
# weights ∝ exp(-E_k): loguniform = E_k ~ Uniform(0, log weight_ratio), max/min <= weight_ratio for any K;
#   exponential = E_k ~ Exponential(mean energy_scale), max/min grows with K;
#   uniform = Uniform(0.1, 0.9) (previous runs)
weight_law: loguniform
weight_ratio: 20
energy_scale: 1.0

energy:
  _target_: adjoint_samplers.energies.dist_energy.DistEnergy
  dist:
    _target_: adjoint_samplers.utils.dist_utils.GMM
    dim: ${dim}
    K: ${K}
    seed: ${target_seed}
    layout: ${layout}
    weight_law: ${weight_law}
    weight_ratio: ${weight_ratio}
    energy_scale: ${energy_scale}
    radius: ${radius}

evaluator:
  _target_: adjoint_samplers.components.evaluator.GMMEvaluator
  w2_samples: 2000 # sample_w2 (exact OT, ~cubic cost) on the first 2000 samples only
  cover_ratio: 0.1 # a mode is covered if it gets >= 10% of its weight: "found", whatever the weight error

# more samples for energy_w2 / mode_tv: the smallest of K=165 modes gets ~2 samples out of 2000.
# Generated in chunks of eval_batch_size (2000), so the sampling CUDA graph is unchanged.
num_eval_samples: 10000

_target_: adjoint_samplers.components.matcher.AdjointVEDartBankMatcher

sweeps: 10          # darting sweeps (1 Barker jump between bank minima + 5 MALA steps each) applied to every new batch of end points before it enters the buffer (rules_selftrain_dartbank.md)
n_bank_starts: 1000 # quench starts from the base law N(0, nu_1 I) for the initial bank (seed bank_seed); the new end points are quenched at every refresh to enrich it
bank_seed: 0
max_bank: 64

grad_state_cost:
  _target_: adjoint_samplers.components.state_cost.ZeroGradStateCost

buffer:
  _target_: adjoint_samplers.components.buffer.BatchBuffer
  buffer_size: ${adjoint_matcher.buffer_size}

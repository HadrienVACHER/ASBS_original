# @package _global_

# gmm_as with the Metropolis-Hastings control variate in the regression target (AdjointVEMHMatcher).
# M = K clusters by default (an oracle on the GMM): try adjoint_matcher.n_clusters=<2K> too.

defaults:
  - gmm_as
  - override /matcher@adjoint_matcher: adjoint_ve_mh

exp_name: gmm${dim}d_as_mh_g${adjoint_matcher.gamma}_M${adjoint_matcher.n_clusters}_rb${adjoint_matcher.rao_blackwell}

adjoint_matcher:
  n_clusters: ${K}

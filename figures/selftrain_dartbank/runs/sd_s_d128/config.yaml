  sigma_max: ${sigma_max}
  sigma_min: ${sigma_min}
controller:
  _target_: adjoint_samplers.components.model.FourierMLP
  dim: ${dim}
  num_layers: 4
  channels: 128
  activation:
    _target_: torch.nn.GELU
  last_bias_init:
    _target_: torch.nn.init.zeros_
    _partial_: true
  last_weight_init:
    _target_: torch.nn.init.zeros_
    _partial_: true

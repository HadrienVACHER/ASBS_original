# @package _global_

# Adjoint Sampling (memoryless) on ManyWell-32 (FAB), frozen big controller (256 x 6), 2000 epochs, from a Dirac at the origin.

defaults:
  - /problem: manywell
  - /source: delta
  - /sde@ref_sde: ve
  - /model@controller: fouriermlp
  - /state_cost: zero
  - /term_cost: score_term_cost
  - /matcher@adjoint_matcher: adjoint_ve

exp_name: manywell_as


# === sde ===
nfe: 200
# MATCHED to the target: 1 x sqrt(mean_j E[x_j^2]) = 1.41 (ManyWell is confined to |x_j| < 2.5). The 2x convention (2.81) sent the initial VE noise into the
# quartic tails: the regression target diverged (loss 5e4 -> 1e16 -> NaN, runs at a67ed56)
sigma_max: ${manywell_std:${dim},1,${well_a},${well_b}}
sigma_min: 0.001
rescale_t: null


# === model ===
controller:
  channels: 256
  num_layers: 6


# === training ===
num_epochs: 2000
# clipped as in the official dw4/lj13 configs: the quartic force is unbounded in the tails and the unclipped regression target diverged (loss 5e4 -> 1e16 -> NaN)
max_grad_E_norm: 100

adjoint_matcher:
  buffer_size: 10000
  duplicates: 10
  resample_size: 1000
  num_epochs_per_stage: ${num_epochs}
  optim:
    lr: 1e-4
    weight_decay: 0


# === eval & logging ===
use_wandb: true
eval_freq: 50

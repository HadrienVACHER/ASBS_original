_target_: adjoint_samplers.components.matcher.AdjointVESteinMatcher

# F = c ν_{1|t} A in the Stein term (ram_stein.tex), c < 0. With A = I, the ∇log p1 of the
# target is scaled by 1 + |c| ν_{1|t}, up to 1 + |c| ν_1 at t = 0 (ν_1 = σ_max² - σ_min² for VE)
c: -0.05
div_estimator: exact # ∇·A of a learned A: exact (d JVPs) or hutchinson (1 JVP)

grad_state_cost:
  _target_: adjoint_samplers.components.state_cost.ZeroGradStateCost

buffer:
  _target_: adjoint_samplers.components.buffer.BatchBuffer
  buffer_size: ${adjoint_matcher.buffer_size}

_target_: adjoint_samplers.components.matcher.AdjointVEGMMDartingMatcher

gamma: 1.0 # value predicted by the 1D quadrature (rules / RESULTS), one setting, no sweep
refresh_every: 25 # epochs between refreshes of the minima / Hessians discovered from the buffer
n_minima_samples: 500
stats_every: 10

grad_state_cost:
  _target_: adjoint_samplers.components.state_cost.ZeroGradStateCost

buffer:
  _target_: adjoint_samplers.components.buffer.BatchBuffer
  buffer_size: ${adjoint_matcher.buffer_size}

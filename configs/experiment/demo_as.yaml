# @package _global_

# Adjoint Sampling (memoryless) on the 1D demo target: ASBS without corrector, from a delta source.

defaults:
  - /problem: demo
  - /source: delta
  - /sde@ref_sde: ve
  - /model@controller: fouriermlp
  - /state_cost: zero
  - /term_cost: score_term_cost
  - /matcher@adjoint_matcher: adjoint_ve

exp_name: demo_as


# === sde ===
nfe: 200
sigma_max: 4 # ~2x the target std (≈1.87)
sigma_min: 0.001
rescale_t: null # quad, cosine


# === training ===
num_epochs: 1000
max_grad_E_norm: null

adjoint_matcher:
  buffer_size: 10000
  duplicates: 10
  resample_size: 512
  num_epochs_per_stage: ${num_epochs} # Ensure always adjoint matching
  optim:
    lr: 1e-3
    weight_decay: 1e-7


# === eval & logging ===
use_wandb: true
eval_freq: 100

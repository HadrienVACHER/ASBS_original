    dim: ${dim}
    K: ${K}
    delta: ${delta}
evaluator:
  _target_: adjoint_samplers.components.evaluator.GMMEvaluator
  w2_samples: 2000
  cover_ratio: 0.1
source:
  _target_: adjoint_samplers.utils.dist_utils.Delta
  dim: ${dim}

# @package _global_

# Adjoint Sampling (memoryless): ASBS without corrector, from a delta source.

defaults:
  - /problem: mosw
  - /source: delta
  - /sde@ref_sde: ve
  - /model@controller: fouriermlp
  - /state_cost: zero
  - /term_cost: score_term_cost
  - /matcher@adjoint_matcher: adjoint_ve

exp_name: mosw${dim}d_as


# === sde ===
nfe: 200
sigma_max: 11.6 # override: pilot grid 5.8 / 11.6 / 23.2 (2 x the std of the uniform(-10, 10) means = 11.6, x 0.5, x 2)
sigma_min: 0.001
rescale_t: null # quad, cosine


# === model ===
controller:
  channels: 128


# === training ===
num_epochs: 300
max_grad_E_norm: null

adjoint_matcher:
  buffer_size: 10000
  duplicates: 10
  resample_size: 1000
  num_epochs_per_stage: ${num_epochs} # Ensure always adjoint matching
  optim:
    lr: 1e-4
    weight_decay: 0


# === eval & logging ===
use_wandb: true
eval_freq: 50

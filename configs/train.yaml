defaults:
  - _self_
  - experiment: demo_asbs
  - lancher: demo_slurm

project: adjoint_sampler_cv
train_itr_per_epoch: 100
init_stage: adjoint
ema_decay: null # EMA of the controller per step (e.g. 0.999): samples for evaluation
ema_buffer: false # also generate the buffer with the EMA controller

seed: 0

dump_final: false # save the final buffer X1 and fresh model samples to samples_final.pt (in the run directory)
dump_n_samples: 10000
# Observer, GMM targets only: every `correction_every` epochs (from `correction_warmup`) fit a proposal on the current buffer,
# refine and cover its centres, run IMH from the buffer states and log what mode_tv the corrected buffer would have
# (corr/*, cost/*). Nothing is fed back into training; the random state is restored.
correction_every: null
correction_warmup: 100
correction_chains: 2000
correction_steps: 60
correction_burn: 15
correction_memory: true # also log a chain whose centres include the minima found at the earlier diagnostics (keys *_mem)

clip_grad_norm: false
checkpoint: null
save_freq: 100

timesteps:
  t0: 0.0
  t1: 1.0
  steps: ${nfe}
  rescale_t: ${rescale_t}

# === hardward related  ===
resample_batch_size: 512
train_batch_size: 512
eval_batch_size: 2000
num_eval_samples: ${eval_batch_size}
# speed (CUDA only, off by default)
fast_sampling: false # replay the SDE simulation as one CUDA graph
buffer_on_device: false # index training batches on the GPU instead of through a DataLoader
fast_train: false # fused Adam + torch.compile of the model in the training step
